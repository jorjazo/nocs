# Development services. Start with:
#   docker compose -f dev/compose.yaml up -d
services:
  indi:
    build:
      context: indi
      dockerfile: Containerfile
    image: nocs-dev-indi
    ports:
      - "127.0.0.1:7624:7624"
    volumes:
      # Driver FIFO, catalog and frame uploads for nocsd (paths from the repo root):
      # NOCS_INDI_FIFO=dev/.run/fifo NOCS_INDI_DRIVERS_DIR=dev/.run/drivers
      # NOCS_INDI_UPLOAD_DIR=/run/indi/uploads NOCS_INDI_UPLOAD_DIR_LOCAL=dev/.run/uploads
      - ./.run:/run/indi
    restart: unless-stopped

  phd2:
    build:
      context: phd2
      dockerfile: Containerfile
    image: nocs-dev-phd2
    init: true
    environment:
      # nocsd writes PHD2's settings into dev/.run (ADR 0022), with
      # NOCS_PHD2_SETTINGS=dev/.run/phd2.phd NOCS_PHD2_INDI_HOST=indi;
      # PHD2 runs the simulators' profile until then.
      PHD2_SETTINGS: /run/nocs/phd2.phd
      PHD2_SETTINGS_DEFAULT: /etc/phd2/simulators.phd
    volumes:
      - ./phd2/simulators.phd:/etc/phd2/simulators.phd:ro
      - ./.run:/run/nocs:ro
    depends_on:
      - indi
    ports:
      - "127.0.0.1:4400:4400"
    restart: unless-stopped
