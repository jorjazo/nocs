[project]
name = "nocs"
version = "0.0.1"
description = "NOCS core daemon (nocsd): web-first control of astrophotography rigs over INDI"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"  # sep has no arm64 wheels for 3.14 yet
dependencies = [
    "anyio>=4.6",
    "astropy>=6.1",
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sep>=1.4",
    "uvicorn[standard]>=0.32",
    "zipstream-ng>=1.8",
]

[project.scripts]
nocsd = "nocs.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM", "PT"]
# Explicit timeout parameters are part of the public API of waiting helpers.
ignore = ["ASYNC109"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "indi: integration tests that need an indiserver running the simulators (NOCS_TEST_INDI=host:port)",
]
