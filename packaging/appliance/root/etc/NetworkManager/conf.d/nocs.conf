# NOCS: Wi-Fi power saving makes the Pi miss frames, from phones on the access point
# and from the home network. In /etc, and named after Ubuntu's
# default-wifi-powersave-on.conf, because NetworkManager reads /etc/NetworkManager/conf.d
# after /usr/lib/NetworkManager/conf.d, and each directory in name order: the last
# file to set it wins.
[connection]
wifi.powersave=2
