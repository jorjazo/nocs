# NOCS (ADR 0028): Wi-Fi power saving makes the Pi miss frames from phones: over the
# access point, a reply waited a minute for TCP's retransmissions. In /etc, after
# Ubuntu's own default-wifi-powersave-on.conf (wifi.powersave=3), which a file in
# /usr/lib cannot override; NOCS's connections also say it themselves.
[connection]
wifi.powersave=2
