# NOCS (ADR 0028, ADR 0043): keys for everyone, root never, and a password for the
# login user nocs alone: the owner passphrase, set when the owner sets it up in the
# app (until then the account is locked, so a password logs nobody in).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Last in this file: a Match block lasts until the end of the file it is in.
Match User nocs
    PasswordAuthentication yes
