# The user nocsd, indiserver and PHD2 run as (ADR 0025). Serial devices (mounts,
# power boxes) need dialout; USB cameras plugdev; the Pi's firmware video; the
# diagnostics bundle reads the services' logs with systemd-journal.
u nocs - "NOCS" /var/lib/nocs
m nocs dialout
m nocs plugdev
m nocs video
m nocs systemd-journal
