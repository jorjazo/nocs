# The user nocsd, indiserver and PHD2 run as (ADR 0025, named nocsd since ADR 0043:
# nocs is the appliance's login). Serial devices (mounts, power boxes) need dialout;
# USB cameras plugdev; the Pi's firmware video; the diagnostics bundle reads the
# services' logs with systemd-journal.
u nocsd - "NOCS server" /var/lib/nocs
m nocsd dialout
m nocsd plugdev
m nocsd video
m nocsd systemd-journal
