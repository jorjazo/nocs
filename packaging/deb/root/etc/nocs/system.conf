# nocs-system's settings (ADR 0027). After changing them:
#   sudo systemctl restart nocs-system

[helper]
# The only user it serves, besides root: the one nocsd runs as.
user = nocs

[operations]
# Groups of operations it performs for nocsd, separated by spaces:
#   power      reboot and power off
#   hostname   rename the box (also its name on the network, <name>.local)
#   storage    mount USB drives when they are plugged in, and eject them
# On a PC, none: the web app cannot reboot or rename the computer. The appliance
# enables them all.
enabled =
