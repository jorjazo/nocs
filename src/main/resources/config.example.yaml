# NOCS configuration. Generated on first run. Edit to taste.
# Bearer token required on every API call: Authorization: Bearer <token>
nocs:
  auth:
    token: GENERATE_ME
  server:
    host: 0.0.0.0
    port: 8080

  # INDI driver backplane. v0.1 uses INDI under the hood; users never see it.
  indi:
    # When true (default), NOCS connects to indiserver on startup. Set false for headless tests.
    auto-connect: true
    # managed  = NOCS spawns indiserver with the drivers below
    # external = NOCS connects to an already-running indiserver on host:port
    # disabled = do not connect (headless NOCS, no devices)
    mode: managed
    host: 127.0.0.1
    port: 7624
    drivers:
      - indi_simulator_telescope
      - indi_simulator_ccd
      - indi_simulator_focus
      - indi_simulator_wheel
    restart:
      initial-backoff-ms: 500
      max-backoff-ms: 30000

  # Target picker (Plan C). Flip online-resolver to true to fall back to SIMBAD
  # when a name is not found in the bundled catalogs.
  targets:
    online-resolver: false
    simbad-base-url: https://simbad.u-strasbg.fr/simbad

  # Observatory defaults are stored in the database (see /api/observatories).
  # On first run, if no observatory row exists, a placeholder is inserted at
  # lat=0, lon=0 and flagged active so API calls have a location to use.

  # Safety rules (Plan F). On first run, a copy of safety.example.yaml is placed
  # in your data_dir as safety.yaml. Edit it (or point rules-path at another file)
  # to change which conditions trigger pause/abort/e-stop. Reload at runtime via
  # POST /api/safety/rules/reload.
  safety:
    # Empty = use ${data_dir}/safety.yaml. Absolute paths are honoured.
    rules-path: ""
    altitude-eval-interval-ms: 10000
    sensor-offline-default-seconds: 60

