server:
  port: 8080

nocs:
  datasource:
    url: jdbc:sqlite:file::memory:?cache=shared
  indi:
    auto-connect: true
    mode: disabled
    host: 127.0.0.1
    port: 7624
    drivers: []
    restart:
      initial-backoff-ms: 500
      max-backoff-ms: 30000
  targets:
    online-resolver: false
    simbad-base-url: https://simbad.u-strasbg.fr/simbad
  safety:
    rules-path: ""
    altitude-eval-interval-ms: 10000
    sensor-offline-default-seconds: 60

spring:
  application:
    name: nocs
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: -1
  datasource:
    url: ${nocs.datasource.url}
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    dev.nocs: DEBUG
