rules:
  - name: humidity-high
    when: { humidity_above: 90 }
    then: pause_sequence
  - name: rain
    when: { rain_detected: true }
    then: e_stop
  - name: low-altitude
    when: { altitude_below: 20 }
    then: abort_and_park
  - name: weather-offline
    when: { sensor_offline: { sensor: weather, threshold_seconds: 120 } }
    then: pause_sequence
