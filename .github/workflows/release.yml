name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux-x86_64
          - runs-on: ubuntu-24.04-arm64
            target: linux-arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      ORG_GRADLE_PROJECT_nocs.packaging.target: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release archive
        run: ./gradlew --no-daemon runtimeDist verifyArchiveSize

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: nocs-${{ matrix.target }}
          path: build/distributions/nocs-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nocs-*
          merge-multiple: true

      - name: Compute SHA-256 sums
        run: |
          cd dist
          sha256sum nocs-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Render release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/{VERSION}/${version}/g" docs/RELEASE_NOTES_TEMPLATE.md > release-notes.md
          cat release-notes.md

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "NOCS ${{ github.ref_name }}"
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: dist/*
