name: Image

# Builds the Raspberry Pi 5 image on an arm64 runner and boots it in a container
# (ADR 0026). Slow (the star database alone is ~900 MB): it runs when the image's
# own files change, for tags, on demand, and on image-test/* branches. Run by hand
# with a release's tag, it builds nothing: it publishes that release's image, already
# on the repository, again (for what publishing adds, such as Imager's list).
on:
  push:
    branches: [main, "image-test/**"]
    paths: [packaging/image/**, packaging/appliance/**, .github/workflows/image.yml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      republish:
        description: "A release's tag (v0.1.0rc6) to publish its image again instead of building one"
        default: ""

jobs:
  pi5:
    if: ${{ !inputs.republish }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: write  # the GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version counts commits
      - name: Make room (the image needs ~15 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the nocs package
        run: packaging/deb/build.sh
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends systemd-container xz-utils fdisk e2fsprogs unzip
      - name: Cache ASTAP and its D50 star database (SourceForge is slow)
        uses: actions/cache@v4
        with:
          path: ~/.cache/nocs/astap
          key: astap-aarch64-d50-v1
      # As in the packages workflow: the runner's AppArmor lets only its own bwrap make
      # user namespaces, and PHD2's image loaders (glycin) need one in the container.
      # A Pi runs them on its own system, whose profiles allow it.
      - name: Allow user namespaces for the container's bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and boot the image
        env:
          NOCS_APT_URL: ${{ vars.NOCS_APT_URL }}
          # A tag's image follows the stable suite, any other one testing (ADR 0035).
          NOCS_APT_SUITE: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'testing' }}
        run: |
          sudo --preserve-env=HOME,NOCS_APT_URL,NOCS_APT_SUITE CACHE="$HOME/.cache/nocs" \
            packaging/image/build.sh packaging/out/nocs_*_arm64.deb
      - name: Let the cache read ASTAP's files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/nocs || true
      - uses: actions/upload-artifact@v4
        with:
          name: nocs-pi5-image
          path: |
            packaging/out/*.img.xz
            packaging/out/*.img.xz.sha256
            packaging/out/*.manifest.txt
          compression-level: 0
          retention-days: 7
      - name: Publish a release's image
        if: startsWith(github.ref, 'refs/tags/v') && vars.NOCS_APT_URL != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NOCS_APT_URL: ${{ vars.NOCS_APT_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(ls packaging/out/*.img.xz)
          python3 packaging/repo/publish.py image --keep 2 --url "$NOCS_APT_URL" \
            "$image" "$image.sha256" packaging/out/*.manifest.txt
          prerelease=()
          [[ $GITHUB_REF_NAME == *rc* ]] && prerelease=(--prerelease)
          notes=(--generate-notes)
          start=$(packaging/repo/notes-start-tag.sh "$GITHUB_REF_NAME")
          [[ -n $start ]] && notes+=(--notes-start-tag "$start")
          gh release create "$GITHUB_REF_NAME" --verify-tag "${notes[@]}" "${prerelease[@]}" \
            || true  # the Packages workflow may have made it first
          gh release upload "$GITHUB_REF_NAME" --clobber "$image.sha256" packaging/out/*.manifest.txt
          link="$NOCS_APT_URL/images/$(basename "$image")"
          notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$(printf '**Raspberry Pi 5 image:** %s (in Raspberry Pi Imager: App options, Content repository, %s)\n\n%s' \
            "$link" "$NOCS_APT_URL/images/rpi-imager.json" "$notes")"

  republish:
    if: ${{ inputs.republish && vars.NOCS_APT_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release's image again
        env:
          TAG: ${{ inputs.republish }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NOCS_APT_URL: ${{ vars.NOCS_APT_URL }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          version=${TAG#v}
          name=nocs-${version/rc/-rc}-pi5-arm64  # as packaging/image/build.sh names it
          mkdir out
          for file in "$name.img.xz" "$name.img.xz.sha256" "$name.manifest.txt"; do
            curl -fsSL -o "out/$file" "$NOCS_APT_URL/images/$file"
          done
          (cd out && sha256sum -c "$name.img.xz.sha256")
          python3 packaging/repo/publish.py image --keep 2 --url "$NOCS_APT_URL" out/*
