name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux-x86_64
            indi: "1"
          - runs-on: ubuntu-24.04-arm64
            target: linux-arm64
            indi: "1"
          - runs-on: windows-latest
            target: windows-x86_64
            indi: "0"
    runs-on: ${{ matrix.runs-on }}
    env:
      ORG_GRADLE_PROJECT_nocs.packaging.target: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install INDI
        if: matrix.indi == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y indi-bin
          which indiserver indi_simulator_telescope indi_simulator_ccd indi_simulator_focus indi_simulator_wheel

      - name: Run tests
        env:
          NOCS_INDI_BIN: ${{ matrix.indi }}
        run: ./gradlew --no-daemon check

      - name: Publish test results (Linux)
        if: (!cancelled()) && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test Results (${{ matrix.target }})
          files: |
            build/test-results/test/**/*.xml
            web/test-results/**/*.xml

      - name: Publish test results (Windows)
        if: (!cancelled()) && runner.os == 'Windows'
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: Test Results (${{ matrix.target }})
          files: |
            build/test-results/test/**/*.xml
            web/test-results/**/*.xml

      - name: Build release archive
        run: ./gradlew --no-daemon runtimeDist verifyArchiveSize

      - name: Smoke-test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./smoke/smoke.sh build/distributions/nocs-*-${{ matrix.target }}.tar.gz

      - name: Smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem "build/distributions/nocs-*-windows-x86_64.zip" | Select-Object -First 1
          if (-not $zip) { throw "windows zip not found" }
          ./smoke/smoke.ps1 -ArchivePath $zip.FullName

      - name: Upload archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nocs-${{ matrix.target }}
          path: build/distributions/nocs-*
          if-no-files-found: error
