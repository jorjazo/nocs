name: CI

# Pushes that change only documentation run nothing (no build reads docs/ or *.md).
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, "**.md"]
  pull_request:
    paths-ignore: [docs/**, "**.md"]

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Unit tests
        run: uv run pytest -m "not indi" -n auto --durations=15

  # Tests against the INDI simulators and PHD2, one at a time on each runner since they
  # share them. The slow ones (pytest -m slow) run only on pushes to main, on a runner
  # of their own, so that a pull request's CI takes a few minutes.
  integration:
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(github.event_name == 'push' && '["not slow", "slow"]' || '["not slow"]') }}
    name: integration (${{ matrix.tests }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      pull-requests: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The simulators' and PHD2's images come from GHCR, built from the PPAs by
      # dev-images.yml (ADR 0050), so a Launchpad outage cannot fail this job. An image
      # whose files this pull request or push changes, or that cannot be pulled, is
      # built here instead, from the PPAs and the cache that workflow writes.
      - name: Pull INDI simulators and PHD2
        id: images
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The files changed here; when they cannot be told, both images are built.
          if [ "$EVENT" = pull_request ]; then
            changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') \
              || changed=$'dev/indi/\ndev/phd2/'
          else
            changed=$(git fetch -q --depth=1 origin "$BEFORE" && git diff --name-only "$BEFORE" HEAD) \
              || changed=$'dev/indi/\ndev/phd2/'
          fi
          pull() {
            for attempt in 1 2 3; do
              docker pull -q "$1" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN" || true
          build=()
          for name in indi phd2; do
            image=ghcr.io/jorjazo/nocs-dev-$name
            if grep -q "^dev/$name/" <<<"$changed"; then
              echo "::notice::dev/$name changes here: building $image"
              build+=("$name")
            elif pull "$image"; then
              docker image inspect "$image" --format \
                "$image {{index .Config.Labels \"org.opencontainers.image.version\"}}, built from {{index .Config.Labels \"org.opencontainers.image.revision\"}}"
            else
              echo "::warning::$image could not be pulled: building it"
              build+=("$name")
            fi
          done
          echo "build=$(IFS=,; echo "${build[*]}")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.images.outputs.build != ''
      - name: Build INDI simulators and PHD2
        if: steps.images.outputs.build != ''
        uses: docker/bake-action@v7
        with:
          source: ./dev
          files: compose.yaml
          targets: ${{ steps.images.outputs.build }}
          load: true
          set: |
            indi.cache-from=type=gha,scope=dev-indi
            phd2.cache-from=type=gha,scope=dev-phd2
      - name: Start INDI simulators and PHD2
        working-directory: .
        run: |
          docker compose -f dev/compose.yaml up -d --no-build indi phd2
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/7624) 2>/dev/null; do sleep 1; done'
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/4400) 2>/dev/null; do sleep 1; done'
      - name: Cache ASTAP and its D05 star database
        uses: actions/cache@v4
        with:
          path: dev/.astap
          key: astap-d05-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/astap/install.sh') }}
      - name: Install ASTAP (SourceForge is slow; cached above)
        working-directory: .
        run: dev/astap/install.sh
      - run: uv sync --locked
      - name: Tests (INDI and PHD2 integration)
        run: uv run pytest -v --durations=30 -m "indi and ${{ matrix.tests }}"
        env:
          NOCS_TEST_INDI: 127.0.0.1:7624
          NOCS_TEST_INDI_FIFO: ../dev/.run/fifo
          NOCS_TEST_INDI_CONTAINER: dev-indi-1
          NOCS_TEST_INDI_UPLOADS: ../dev/.run/uploads
          NOCS_TEST_PHD2: 127.0.0.1:4400
          NOCS_TEST_PHD2_SETTINGS: ../dev/.run/phd2.phd
          NOCS_TEST_ASTAP: ../dev/.astap/astap_cli
      - name: indiserver and PHD2 logs
        if: failure()
        working-directory: .
        run: docker compose -f dev/compose.yaml logs --tail 200

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the server schema
        run: |
          pnpm gen:types
          git diff --exit-code -- src/lib/generated || {
            echo "::error::src/lib/generated is stale: run 'pnpm gen:types' in web/ and commit"
            exit 1
          }
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
