name: CI

# Pushes that change only documentation run nothing (no build reads docs/ or *.md).
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, "**.md"]
  pull_request:
    paths-ignore: [docs/**, "**.md"]

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The simulators' and PHD2's images come from the Actions cache, built again
      # each ISO week (APT_REFRESH) to follow the PPAs, or when their files change.
      - name: ISO week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build INDI simulators and PHD2
        uses: docker/bake-action@v7
        with:
          source: ./dev
          files: compose.yaml
          targets: indi,phd2
          load: true
          set: |
            *.args.APT_REFRESH=${{ steps.week.outputs.week }}
            indi.cache-from=type=gha,scope=dev-indi
            indi.cache-to=type=gha,scope=dev-indi,mode=max
            phd2.cache-from=type=gha,scope=dev-phd2
            phd2.cache-to=type=gha,scope=dev-phd2,mode=max
      - name: Start INDI simulators and PHD2
        working-directory: .
        run: |
          docker compose -f dev/compose.yaml up -d --no-build indi phd2
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/7624) 2>/dev/null; do sleep 1; done'
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/4400) 2>/dev/null; do sleep 1; done'
      - name: Cache ASTAP and its D05 star database
        uses: actions/cache@v4
        with:
          path: dev/.astap
          key: astap-d05-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/astap/install.sh') }}
      - name: Install ASTAP (SourceForge is slow; cached above)
        working-directory: .
        run: dev/astap/install.sh
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Tests (unit, INDI and PHD2 integration)
        run: uv run pytest -v --durations=30
        env:
          NOCS_TEST_INDI: 127.0.0.1:7624
          NOCS_TEST_INDI_FIFO: ../dev/.run/fifo
          NOCS_TEST_INDI_CONTAINER: dev-indi-1
          NOCS_TEST_INDI_UPLOADS: ../dev/.run/uploads
          NOCS_TEST_PHD2: 127.0.0.1:4400
          NOCS_TEST_PHD2_SETTINGS: ../dev/.run/phd2.phd
          NOCS_TEST_ASTAP: ../dev/.astap/astap_cli
      - name: indiserver and PHD2 logs
        if: failure()
        working-directory: .
        run: docker compose -f dev/compose.yaml logs --tail 200

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the server schema
        run: |
          pnpm gen:types
          git diff --exit-code -- src/lib/generated || {
            echo "::error::src/lib/generated is stale: run 'pnpm gen:types' in web/ and commit"
            exit 1
          }
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
